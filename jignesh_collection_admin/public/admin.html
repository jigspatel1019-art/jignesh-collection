<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Jignesh Collection</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f1ee;color:#2b1824}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.panel{background:#fff;padding:22px;border-radius:18px;border:1px solid #eadbd5;margin-bottom:20px}.login{max-width:430px;margin:12vh auto}.brand{font:28px Georgia;color:#8b3158}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.input{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #d9c8c2;border-radius:9px;font:inherit}.btn{background:#8b3158;color:#fff;border:0;border-radius:22px;padding:12px 20px;font-weight:bold;cursor:pointer}.gray{background:#75656c}.danger{background:#a52b42}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.prod{border:1px solid #eadbd5;border-radius:14px;overflow:hidden;background:#fff}.photo{height:210px;background:#f1e3df;display:flex;align-items:center;justify-content:center;color:#9a7d86}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.msg{padding:10px;border-radius:8px;background:#f8e7ec;margin-bottom:15px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.head{flex-direction:column;align-items:flex-start;gap:12px}}</style></head><body><div class="wrap"><div id="login" class="panel login"><div class="brand">JIGNESH COLLECTION</div><p>Admin Panel</p><div id="lm" class="msg" style="display:none"></div><input id="pw" class="input" type="password" placeholder="Admin password"><button class="btn" id="lb">Login</button><p><a href="/">← Back to website</a></p></div><div id="app" style="display:none"><div class="head"><div><div class="brand">JIGNESH COLLECTION</div><small>Product Admin Panel</small></div><div><button class="btn gray" id="lo">Logout</button> <a class="btn" href="/">View Website</a></div></div><div class="panel"><h2 id="ft">Add New Product</h2><div id="m" class="msg" style="display:none"></div><form id="f"><input type="hidden" id="id"><label>Category</label><select id="cat" class="input"><option>Sarees</option><option>Jewellery</option><option>Accessories</option></select><label>Product Name</label><input id="name" class="input" required placeholder="Banarasi Silk Saree"><label>Price</label><input id="price" class="input" required placeholder="₹1,499"><label>Description</label><textarea id="desc" class="input" rows="4" placeholder="Fabric, colour, occasion..."></textarea><label>Product Photo</label><input id="img" class="input" type="file" accept="image/*"><button class="btn">Save Product</button> <button type="button" class="btn gray" id="clear">Clear</button></form></div><div class="panel"><h2>Your Products</h2><div class="grid" id="list"></div></div></div></div><script>const $=x=>document.getElementById(x);function message(t,x="m"){let e=$(x);e.textContent=t;e.style.display="block"}async function check(){let r=await fetch("/api/admin-products");if(r.ok){login.style.display="none";app.style.display="block";load()}}lb.onclick=async()=>{let r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw.value})});if(r.ok)check();else message("Incorrect password","lm")};lo.onclick=async()=>{await fetch("/api/logout",{method:"POST"});location.reload()};function reset(){f.reset();id.value="";ft.textContent="Add New Product"}clear.onclick=reset;async function load(){let a=await(await fetch("/api/admin-products")).json();list.innerHTML=a.map(x=>`<div class="prod"><div class="photo">${x.image?`<img src="${x.image}" alt="">`:"No photo"}</div><div class="body"><b>${x.name}</b><br>${x.category} · ${x.price}<p>${x.description||""}</p><button class="btn" onclick='edit(${JSON.stringify(x)})'>Edit</button> <button class="btn danger" onclick="del('${x.id}')">Delete</button></div></div>`).join("")||"<p>No products yet.</p>"}window.edit=x=>{id.value=x.id;cat.value=x.category;name.value=x.name;price.value=x.price;desc.value=x.description;ft.textContent="Edit Product: "+x.name;scrollTo({top:0,behavior:"smooth"})};f.onsubmit=async e=>{e.preventDefault();let d=new FormData();d.append("id",id.value);d.append("category",cat.value);d.append("name",name.value);d.append("price",price.value);d.append("description",desc.value);if(img.files[0])d.append("image",img.files[0]);let r=await fetch("/api/save-product",{method:"POST",body:d}),j=await r.json();if(r.ok){message("Product saved successfully.");reset();load()}else message(j.error||"Could not save")};window.del=async id=>{if(!confirm("Delete this product?"))return;await fetch("/api/delete-product",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id})});load()};check();</script></body></html>
